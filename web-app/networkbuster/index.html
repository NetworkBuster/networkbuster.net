<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NetworkBuster App</title>
</head>
<body>
  <h1>NetworkBuster App</h1>
  <p>Small UI stub — uses API keys for auth. Configure via docs.</p>
  <button id="info">Get Info</button>
  <pre id="out"></pre>
  <script>
    document.getElementById('info').addEventListener('click', async () => {
      const res = await fetch('/api/proxy/networkbuster/info');
      const j = await res.json();
      document.getElementById('out').textContent = JSON.stringify(j, null, 2);
    });
  </script>
</body>
</html>
