<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NetworkBuster - Submit Bid</title>
</head>
<body>
  <h1>Submit NASA Bid</h1>
  <form id="bid">
    <label>Name: <input name="name" required></label><br>
    <label>Email: <input name="email" type="email" required></label><br>
    <label>Proposal: <textarea name="body" required></textarea></label><br>
    <button type="submit">Submit</button>
  </form>
  <pre id="out"></pre>
  <script>
    document.getElementById('bid').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = { name: fd.get('name'), email: fd.get('email'), body: fd.get('body') };
      const res = await fetch('/networkbuster/bid', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await res.json();
      document.getElementById('out').textContent = JSON.stringify(j, null, 2);
    });
  </script>
</body>
</html>
